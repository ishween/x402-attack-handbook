e='11.5' fill='#16202E'>1 settled, 4 rejected</text><text x='290.0' y='338' text-anchor='middle' font-size='12' font-weight='600' fill='#16202E'>Fix (seller): claim #7 once</text><text x='290.0' y='356' text-anchor='middle' font-size='11.5' fill='#16202E'>shared store, onBeforeVerify</text><text x='290.0' y='374' text-anchor='middle' font-size='11.5' fill='#16202E'>copies 2 to 5 get the saved reply</text><text x='195.0' y='423' text-anchor='middle' font-size='11.5' fill='#16202E'>reply times out</text><text x='195.0' y='457' text-anchor='middle' font-size='11.5' font-weight='600' fill='#16202E'>retry with NEW payment #8: charged twice</text><text x='117.10000000000001' y='502' text-anchor='middle' font-size='12' font-weight='600' fill='#16202E'>Fix (buyer): resend the</text><text x='117.10000000000001' y='520' text-anchor='middle' font-size='11.5' fill='#16202E'>same signed payment #7</text></svg>