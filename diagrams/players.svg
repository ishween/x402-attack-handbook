' font-size='11.5' fill='#16202E'>Answers 402 with a price,</text><text x='290' y='106' text-anchor='middle' font-size='11.5' fill='#16202E'>then delivers.</text><text x='290' y='161' text-anchor='middle' font-size='13' font-weight='600' fill='#16202E'>Seller</text><text x='290' y='190' text-anchor='middle' font-size='11' fill='#5B6574'>Your server</text><text x='290' y='205' text-anchor='middle' font-size='11' fill='#5B6574'>@x402/express or /hono</text><text x='480' y='79' text-anchor='middle' font-size='11.5' fill='#16202E'>Verifies the signature,</text><text x='480' y='97' text-anchor='middle' font-size='11.5' fill='#16202E'>then settles on chain.</text><text x='480' y='161' text-anchor='middle' font-size='13' font-weight='600' fill='#16202E'>Facilitator</text><text x='480' y='190' text-anchor='middle' font-size='11' fill='#5B6574'>Hosted service</text><text x='480' y='205' text-anchor='middle' font-size='11' fill='#5B6574'>(public testnet one in lab)</text><text x='670' y='79' text-anchor='middle' font-size='11.5' fill='#16202E'>Where the money</text><text x='670' y='97' text-anchor='middle' font-size='11.5' fill='#16202E'>moves.</text><text x='670' y='161' text-anchor='middle' font-size='13' font-weight='600' fill='#16202E'>Chain</text><text x='670' y='190' text-anchor='middle' font-size='11' fill='#5B6574'>Base Sepolia</text><text x='670' y='205' text-anchor='middle' font-size='11' fill='#5B6574'>(testnet) in the lab</text><text x='195.0' y='261' text-anchor='middle' font-size='11.5' fill='#16202E'>1. GET /lookup</text><text x='195.0' y='297' text-anchor='middle' font-size='11.5' fill='#16202E'>2. 402 + price list</text><text x='144' y='344' font-size='11.5' fill='#16202E'>3. pick one, sign it</text><text x='195.0' y='369' text-anchor='middle' font-size='11.5' fill='#16202E'>4. same request + payment</text><text x='385.0' y='405' text-anchor='middle' font-size='11.5' fill='#16202E'>5. verify</text><text x='385.0' y='441' text-anchor='middle' font-size='11.5' 